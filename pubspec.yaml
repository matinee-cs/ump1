name: ump_music
description: UMP - Unidentified Music Player (Samsung One UI Inspired)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Audio Playback & Service
  just_audio: ^0.9.36
  audio_service: ^0.18.12
  
  # Youtube & Streaming Backend
  youtube_explode_dart: ^2.2.1
  
  # UI & State Management
  flutter_bloc: ^8.1.3
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.1
  palette_generator: ^0.3.3+3
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
